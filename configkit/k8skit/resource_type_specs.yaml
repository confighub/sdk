# One declaration per Kubernetes resource type, replacing the per-concern tables that each
# named a subset of the types. See docs/design/resource-type-specs.md.
#
# It carries the structure half -- merge keys, exclusive fields, and map-key paths, which is
# what decides whether a stored path is `containers.?name=runner` or `containers.0` -- and the
# attribute half: which attributes a type has and where they live.
#
# It is embedded with go:embed and compiled at package init. The same format loads from a
# file, and is the format a stored spec Unit is meant to hold, so a type registered without a
# ConfigHub release is registered the way the built-ins are.
#
# Paths are gaby dot syntax, `*` for any array index. Every path in a shape is relative to
# wherever that shape is embedded; every path on a resource type is relative to the resource.
#
# Attributes declared here:
#
#   immutable        Fields that cannot change after creation; changing one requires deleting
#                    and recreating the resource. Transcribed from Kubernetes validation source
#                    and from the ACK and Crossplane CRDs. Read by vet-immutable.
#
#   hostname         Fields holding a single DNS hostname. Each path must address one hostname
#                    scalar -- an element of a string array via `*` is fine -- because the
#                    subdomain and domain within it are read through an accessor at
#                    "<path>#subdomain" and "<path>#domain". A field packing several hostnames
#                    into one string, such as a Traefik IngressRoute match expression, does not
#                    belong here.
#
#   replicas         The desired number of pods, on the controllers that manage a replicated
#                    set of them. Read by get-replicas and written by set-replicas.
#
#   pod-template-labels
#                    The labels that end up on the pods a workload produces. Declared on the
#                    PodTemplate shape, so every type embedding a pod template has it at the
#                    right depth. v1/Pod declares its own metadata.labels: it produces no pods
#                    because it is one.
#
#   pod-label-selector
#                    Where the selector that finds those pods lives. For matchLabels-style
#                    selectors that is the matchLabels map; for the flat v1/Service selector it
#                    is spec.selector itself.
#
#                    Only selectors targeting the resource's *own* pods belong here. A
#                    NetworkPolicy's spec.podSelector does; its spec.ingress[].from[].podSelector
#                    and spec.egress[].to[].podSelector do not, because those reference other
#                    workloads and rewriting them would repoint the policy.
#
#                    These two were one attribute, workload-labels, when they were two tables.
#                    They are separate because only one of them is safe to change freely: a
#                    selector is immutable on most workloads. get/set-workload-labels still read
#                    both, through the workload-labels attribute group.
#
#   resource-name    A field naming another resource, declared with `target:` -- the type it
#                    names. It compiles to the ResourceType property that needs and provides
#                    matching selects on, so a Link can resolve the field to a Unit holding a
#                    resource of that type.
#
#                    Pod-spec references are declared on the PodSpec and Containers shapes, so
#                    every type carrying a pod spec has them at the right depth and every
#                    container array has them, rather than each type listing its own.
#
#                    The built-in types' references were transcribed from kustomize's
#                    NameReferenceFieldSpecs; see function-impl/third_party/kustomize.
#
#                    A namespace field is declared twice, once here and once as a
#                    namespace-name-reference, because it is two things: a reference to a
#                    Namespace, and the namespace of the resource holding it. get-namespace and
#                    set-namespace read the second name. The exceptions are metadata.namespace,
#                    which is registered against every type at once, and a Namespace's own
#                    metadata.name, which is the namespace rather than a reference to one; both
#                    are registered in function-impl/kubernetes.
#
#                    A `|` prefix on a leaf segment (`service.|namespace`) gates upsert: the
#                    parent chain up to that segment must already exist for the path to resolve,
#                    but the leaf is created if missing. That keeps set-namespace from inventing
#                    optional sub-objects -- a CRD's spec.conversion.webhook -- on resources that
#                    do not have them, while still adding subjects[*].namespace to every
#                    ServiceAccount subject of a binding that does.

toolchainType: Kubernetes/YAML

shapes:
  # A container array. Every container kind -- containers, initContainers,
  # ephemeralContainers -- has the same shape, which is why it is declared once and embedded
  # three times rather than enumerated per array.
  #
  # The shape sits at the array rather than at an element, because the element is not spelled
  # the same way throughout. Structure holds for any element, so it is stated with a wildcard.
  # An attribute acts on one container, so it states the selector that picks it --
  # `?name:container-name=%s` -- and that spelling is kept in the registered path because it is
  # what a setter writes through. container-name is the exception: it enumerates the containers,
  # so that functions taking a container-name argument have something to enumerate.
  Containers:
    mergeKeys:
      - {path: "*.env", key: name}
      - {path: "*.ports", key: containerPort, extraKeys: [protocol]}
      - {path: "*.volumeDevices", key: devicePath}
      - {path: "*.volumeMounts", key: mountPath}
    exclusiveFields:
      # The fields that say *how* to probe, as opposed to the timing fields beside them.
      - {path: "*.livenessProbe", members: [exec, grpc, httpGet, tcpSocket]}
      - {path: "*.readinessProbe", members: [exec, grpc, httpGet, tcpSocket]}
      - {path: "*.startupProbe", members: [exec, grpc, httpGet, tcpSocket]}
      - {path: "*.lifecycle.postStart", members: [exec, grpc, httpGet, tcpSocket]}
      - {path: "*.lifecycle.preStop", members: [exec, grpc, httpGet, tcpSocket]}
      # An env var has a literal value or a reference, never both.
      - {path: "*.env.*", members: [value, valueFrom]}
      # io.k8s.api.core.v1.EnvVarSource.
      - path: "*.env.*.valueFrom"
        members: [configMapKeyRef, fieldRef, fileKeyRef, resourceFieldRef, secretKeyRef]
    attributes:
      # Enumerates the containers, so that functions operating on a specified container have
      # something to enumerate. That is why it is the one path stated for any element.
      container-name:
        - {path: "*.name"}
      # The rest act on one container, so they carry the selector that picks it.
      # container-resources registers no getter or setter because set-container-resources is not
      # a path setter: it takes an operation (all, cap or floor) alongside the cpu and memory to
      # set, and decides per value whether to write. The path is registered so the resources are
      # addressable; the function reaches them itself.
      container-image:
        - {path: "?name:container-name=%s.image"}
      container-repository-uri:
        - {path: "?name:container-name=%s.image#uri"}
      container-image-reference:
        - {path: "?name:container-name=%s.image#reference"}
      env-value:
        - {path: "?name:container-name=%s.env.?name:env-var=%s.value"}
      container-resources:
        - {path: "?name:container-name=%s.resources", dataType: YAML}
      container-flag:
        - {path: "?name:container-name=%s.args.?flag:container-flag=%s#value"}
      # Defaults written by set-pod-security-defaults, per container. The value is on the path
      # because that is what varies: one attribute, a different default at each field.
      pod-container-security-context-defaults:
        - {path: "*.securityContext.allowPrivilegeEscalation", dataType: bool, default: false}
        - {path: "*.securityContext.privileged", dataType: bool, default: false}
        - {path: "*.securityContext.readOnlyRootFilesystem", dataType: bool, default: true}
        - {path: "*.securityContext.capabilities.drop", dataType: "[]string", default: [ALL]}
      # Written by set-container-resource-defaults.
      container-resources-defaults:
        - {path: "*.resources.requests.cpu", dataType: string, default: 128m}
        - {path: "*.resources.requests.memory", dataType: string, default: 128Mi}
      # Fields naming another resource. Declared on the shape, so every container array has
      # them -- including ephemeralContainers, which the per-type table did not reach.
      resource-name:
        - {path: "*.env.*.valueFrom.configMapKeyRef.name", target: v1/ConfigMap}
        - {path: "*.env.*.valueFrom.secretKeyRef.name", target: v1/Secret}
        - {path: "*.envFrom.*.configMapRef.name", target: v1/ConfigMap}
        - {path: "*.envFrom.*.secretRef.name", target: v1/Secret}

  # io.k8s.api.core.v1.PodSpec, relative to wherever a type puts one.
  PodSpec:
    embeds:
      - {shape: Containers, path: containers}
      - {shape: Containers, path: initContainers}
      - {shape: Containers, path: ephemeralContainers}
    mergeKeys:
      - {path: containers, key: name}
      - {path: ephemeralContainers, key: name}
      - {path: hostAliases, key: ip}
      - {path: imagePullSecrets, key: name}
      - {path: initContainers, key: name}
      - {path: resourceClaims, key: name}
      - {path: schedulingGates, key: name}
      - {path: topologySpreadConstraints, key: topologyKey, extraKeys: [whenUnsatisfiable]}
      - {path: volumes, key: name}
    exclusiveFields:
      # The inline members of a Volume's source union, from io.k8s.api.core.v1.Volume: every
      # property but `name`. There is no discriminator -- the member that is present is what
      # says which kind of volume this is.
      - path: volumes.*
        members:
          - awsElasticBlockStore
          - azureDisk
          - azureFile
          - cephfs
          - cinder
          - configMap
          - csi
          - downwardAPI
          - emptyDir
          - ephemeral
          - fc
          - flexVolume
          - flocker
          - gcePersistentDisk
          - gitRepo
          - glusterfs
          - hostPath
          - image
          - iscsi
          - nfs
          - persistentVolumeClaim
          - photonPersistentDisk
          - portworxVolume
          - projected
          - quobyte
          - rbd
          - scaleIO
          - secret
          - storageos
          - vsphereVolume
      # A pod's claim names either a claim or a template, never both.
      - {path: resourceClaims.*, members: [resourceClaimName, resourceClaimTemplateName]}

    attributes:
      # Written by set-automount-service-account-token.
      automount-service-account-token:
        - {path: automountServiceAccountToken, dataType: bool, default: false}
      # Pod-level half of set-pod-security-defaults; the container-level half is on Containers.
      pod-container-security-context-defaults:
        - {path: securityContext.seccompProfile.type, dataType: string, default: RuntimeDefault}
        - {path: securityContext.runAsNonRoot, dataType: bool, default: true}
        - {path: securityContext.runAsUser, dataType: int, default: 1000}
        - {path: securityContext.runAsGroup, dataType: int, default: 3000}
        - {path: securityContext.fsGroup, dataType: int, default: 2000}
      # Fields naming another resource. Stated once here rather than once per type that
      # carries a pod spec, which is what left ReplicationController, ReplicaSet and
      # PodTemplate with some of them and not others.
      resource-name:
        - {path: imagePullSecrets.*.name, target: v1/Secret}
        - {path: priorityClassName, target: scheduling.k8s.io/v1/PriorityClass}
        - {path: serviceAccountName, target: v1/ServiceAccount}
        - {path: volumes.*.configMap.name, target: v1/ConfigMap}
        - {path: volumes.*.persistentVolumeClaim.claimName, target: v1/PersistentVolumeClaim}
        - {path: volumes.*.projected.sources.*.configMap.name, target: v1/ConfigMap}
        - {path: volumes.*.projected.sources.*.secret.name, target: v1/Secret}
        - {path: volumes.*.secret.secretName, target: v1/Secret}

  # io.k8s.api.core.v1.PodTemplateSpec: pod metadata beside a PodSpec. The metadata path is
  # what the tables could not express -- they stored the PodSpec path and derived the metadata
  # path back out of it by string surgery.
  PodTemplate:
    embeds:
      - {shape: PodSpec, path: spec}
    mapKeyPaths:
      - metadata.labels.*
      - metadata.annotations.*
    attributes:
      # The labels that end up on the pods this template produces. Declared here rather than
      # per type, so every type that embeds a pod template gets it at the right depth.
      pod-template-labels:
        - {path: metadata.labels}
      # The hash of a ConfigMap this workload mounts, propagated here so that a change to the
      # ConfigMap's content rolls the pods it produces. Declared on the shape, so every type
      # carrying a pod template wants it at the right depth.
      configmap-hash:
        - {path: metadata.annotations.confighub~1com/Hash, needed: true}

resourceTypes:
  # ---------------------------------------------------------------------------------------
  # Universal: facts that hold for every Kubernetes resource type
  # ---------------------------------------------------------------------------------------
  - type: "*"
    mergeKeys:
      - {path: metadata.ownerReferences, key: uid}
    mapKeyPaths:
      - metadata.labels.*
      - metadata.annotations.*
      - spec.selector.matchLabels.*

  # ---------------------------------------------------------------------------------------
  # Workloads
  #
  # A rolling-update strategy is one optional member gated by a `type` discriminator. Recreate
  # and OnDelete permit nothing, which is the whole point -- a strategy that has moved off
  # RollingUpdate must not still carry rollingUpdate.
  # ---------------------------------------------------------------------------------------
  - type: apps/v1/Deployment
    embeds:
      - {shape: PodTemplate, path: spec.template}
    exclusiveFields:
      - path: spec.strategy
        members: [rollingUpdate]
        discriminator: type
        allowedMember: {RollingUpdate: rollingUpdate}
    attributes:
      replicas:
        - {path: spec.replicas}
      pod-label-selector:
        - {path: spec.selector.matchLabels}
      immutable:
        - {path: spec.selector}

  - type: apps/v1/ReplicaSet
    embeds:
      - {shape: PodTemplate, path: spec.template}
    attributes:
      replicas:
        - {path: spec.replicas}
      pod-label-selector:
        - {path: spec.selector.matchLabels}
      immutable:
        - {path: spec.selector}

  - type: apps/v1/DaemonSet
    embeds:
      - {shape: PodTemplate, path: spec.template}
    exclusiveFields:
      - path: spec.updateStrategy
        members: [rollingUpdate]
        discriminator: type
        allowedMember: {RollingUpdate: rollingUpdate}
    attributes:
      pod-label-selector:
        - {path: spec.selector.matchLabels}
      immutable:
        - {path: spec.selector}

  - type: apps/v1/StatefulSet
    embeds:
      - {shape: PodTemplate, path: spec.template}
    mergeKeys:
      - {path: spec.volumeClaimTemplates.*.metadata.ownerReferences, key: uid}
    exclusiveFields:
      - path: spec.updateStrategy
        members: [rollingUpdate]
        discriminator: type
        allowedMember: {RollingUpdate: rollingUpdate}
    attributes:
      resource-name:
        - {path: spec.serviceName, target: v1/Service}
        - {path: spec.volumeClaimTemplates.*.spec.storageClassName, target: storage.k8s.io/v1/StorageClass}
      replicas:
        - {path: spec.replicas}
      pod-label-selector:
        - {path: spec.selector.matchLabels}
      immutable:
        - {path: spec.selector}
        - {path: spec.serviceName}
        - {path: spec.podManagementPolicy}
        - {path: spec.volumeClaimTemplates}

  - type: batch/v1/Job
    embeds:
      - {shape: PodTemplate, path: spec.template}
    attributes:
      pod-label-selector:
        - {path: spec.selector.matchLabels}
      immutable:
        - {path: spec.selector}
        - {path: spec.completionMode}
        - {path: spec.completions}
        - {path: spec.template}
        - {path: spec.podFailurePolicy}
        - {path: spec.backoffLimitPerIndex}
        - {path: spec.managedBy}
        - {path: spec.successPolicy}

  - type: batch/v1/CronJob
    embeds:
      - {shape: PodTemplate, path: spec.jobTemplate.spec.template}
    attributes:
      pod-label-selector:
        - {path: spec.jobTemplate.spec.selector.matchLabels}

  # A ReplicationController's selector is a flat map, like a Service's, not matchLabels.
  - type: v1/ReplicationController
    embeds:
      - {shape: PodTemplate, path: spec.template}
    attributes:
      replicas:
        - {path: spec.replicas}
      pod-label-selector:
        - {path: spec.selector}

  - type: v1/PodTemplate
    embeds:
      - {shape: PodTemplate, path: template}

  - type: argoproj.io/v1alpha1/Rollout
    embeds:
      - {shape: PodTemplate, path: spec.template}
    attributes:
      resource-name:
        - {path: spec.strategy.blueGreen.activeService, target: v1/Service}
        - {path: spec.strategy.blueGreen.previewService, target: v1/Service}
        - {path: spec.strategy.canary.canaryService, target: v1/Service}
        - {path: spec.strategy.canary.pingPongService, target: v1/Service}
        - {path: spec.strategy.canary.stableService, target: v1/Service}
        - {path: spec.strategy.canary.trafficRouting.istio.destinationRule.name, target: networking.istio.io/v1/DestinationRule}
        - {path: spec.strategy.canary.trafficRouting.istio.virtualService.name, target: networking.istio.io/v1/VirtualService}
      replicas:
        - {path: spec.replicas}
      pod-label-selector:
        - {path: spec.selector.matchLabels}

  # A Pod carries a PodSpec directly. It has no pod template, so it gets no pod-template
  # metadata paths -- which is why `spec.metadata.labels.*`, a path that does not exist in a
  # Pod, is not here. The tables derived it by trimming a `.spec` suffix a Pod's `spec` does
  # not have.
  - type: v1/Pod
    embeds:
      - {shape: PodSpec, path: spec}
    attributes:
      configmap-hash:
        - {path: metadata.annotations.confighub~1com/Hash, needed: true}
      pod-template-labels:
        - {path: metadata.labels}
      immutable:
        - {path: spec.volumes}
        - {path: spec.initContainers}
        - {path: spec.containers}
        - {path: spec.ephemeralContainers}
        - {path: spec.restartPolicy}
        - {path: spec.dnsPolicy}
        - {path: spec.dnsConfig}
        - {path: spec.nodeSelector}
        - {path: spec.nodeName}
        - {path: spec.serviceAccountName}
        - {path: spec.automountServiceAccountToken}
        - {path: spec.hostNetwork}
        - {path: spec.hostPID}
        - {path: spec.hostIPC}
        - {path: spec.hostUsers}
        - {path: spec.shareProcessNamespace}
        - {path: spec.securityContext}
        - {path: spec.imagePullSecrets}
        - {path: spec.hostname}
        - {path: spec.subdomain}
        - {path: spec.setHostnameAsFQDN}
        - {path: spec.affinity}
        - {path: spec.schedulerName}
        - {path: spec.hostAliases}
        - {path: spec.priorityClassName}
        - {path: spec.priority}
        - {path: spec.preemptionPolicy}
        - {path: spec.readinessGates}
        - {path: spec.runtimeClassName}
        - {path: spec.enableServiceLinks}
        - {path: spec.overhead}
        - {path: spec.topologySpreadConstraints}
        - {path: spec.os}
        - {path: spec.resourceClaims}

  # ---------------------------------------------------------------------------------------
  # Admission registration
  # ---------------------------------------------------------------------------------------
  - type: admissionregistration.k8s.io/v1/MutatingAdmissionPolicy
    mergeKeys:
      - {path: spec.matchConditions, key: name}

  - type: admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    mergeKeys:
      - {path: spec.matchConditions, key: name}
      - {path: spec.variables, key: name}

  - type: admissionregistration.k8s.io/v1/MutatingWebhookConfiguration
    mergeKeys:
      - {path: webhooks, key: name}
      - {path: webhooks.*.matchConditions, key: name}
    attributes:
      namespace-name-reference:
        - {path: "webhooks.*.clientConfig.service.|namespace", target: v1/Namespace}
      resource-name:
        - {path: "webhooks.*.clientConfig.service.|namespace", target: v1/Namespace}
        - {path: webhooks.*.clientConfig.service.name, target: v1/Service}

  - type: admissionregistration.k8s.io/v1/ValidatingWebhookConfiguration
    mergeKeys:
      - {path: webhooks, key: name}
      - {path: webhooks.*.matchConditions, key: name}
    attributes:
      namespace-name-reference:
        - {path: "webhooks.*.clientConfig.service.|namespace", target: v1/Namespace}
      resource-name:
        - {path: "webhooks.*.clientConfig.service.|namespace", target: v1/Namespace}
        - {path: webhooks.*.clientConfig.service.name, target: v1/Service}

  # ---------------------------------------------------------------------------------------
  # CRDs
  # ---------------------------------------------------------------------------------------
  - type: apiextensions.k8s.io/v1/CustomResourceDefinition
    mergeKeys:
      - {path: spec.versions.*.schema.openAPIV3Schema.x-kubernetes-validations, key: rule}
    attributes:
      resource-name:
        - {path: "spec.conversion.webhook.clientConfig.service.|namespace", target: v1/Namespace}
      namespace-name-reference:
        - {path: "spec.conversion.webhook.clientConfig.service.|namespace", target: v1/Namespace}

  # ---------------------------------------------------------------------------------------
  # Core
  # ---------------------------------------------------------------------------------------
  - type: v1/Service
    mergeKeys:
      - {path: spec.ports, key: port, extraKeys: [protocol]}
    attributes:
      hostname:
        - {path: metadata.annotations.external-dns~1alpha~1kubernetes~1io/hostname}
      pod-label-selector:
        - {path: spec.selector}
      immutable:
        - {path: spec.clusterIP}
        - {path: spec.clusterIPs}
        - {path: spec.ipFamilies}
        - {path: spec.ipFamilyPolicy}
        - {path: spec.healthCheckNodePort}

  - type: v1/ServiceAccount
    mergeKeys:
      - {path: secrets, key: name}
    attributes:
      resource-name:
        - {path: imagePullSecrets.*.name, target: v1/Secret}

  # Deprecated but still in the spec.
  - type: v1/ComponentStatus
    mergeKeys:
      - {path: conditions, key: type}

  # The same volume-source union as a PodSpec volume, inline on the spec.
  - type: v1/PersistentVolume
    exclusiveFields:
      - path: spec
        members:
          - awsElasticBlockStore
          - azureDisk
          - azureFile
          - cephfs
          - cinder
          - configMap
          - csi
          - downwardAPI
          - emptyDir
          - ephemeral
          - fc
          - flexVolume
          - flocker
          - gcePersistentDisk
          - gitRepo
          - glusterfs
          - hostPath
          - image
          - iscsi
          - nfs
          - persistentVolumeClaim
          - photonPersistentDisk
          - portworxVolume
          - projected
          - quobyte
          - rbd
          - scaleIO
          - secret
          - storageos
          - vsphereVolume
    attributes:
      resource-name:
        - {path: spec.azureFile.secretName, target: v1/Secret}
        - {path: spec.storageClassName, target: storage.k8s.io/v1/StorageClass}
      immutable:
        - {path: spec.persistentVolumeSource}
        - {path: spec.volumeMode}
        - {path: spec.storageClassName}
        - {path: spec.nodeAffinity}

  # ---------------------------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------------------------
  - type: storage.k8s.io/v1/CSINode
    mergeKeys:
      - {path: spec.drivers, key: name}

  # ---------------------------------------------------------------------------------------
  # Types whose only declared fact is which of their fields are immutable after creation.
  #
  # Transcribed from Kubernetes validation source -- pkg/apis/{core,apps,batch,storage,
  # networking,discovery,rbac,scheduling}/validation -- and from the ACK and Crossplane
  # CRDs. Not exhaustive: a type absent from this file is ordinary, not an error.
  # ---------------------------------------------------------------------------------------
  - type: discovery.k8s.io/v1/EndpointSlice
    attributes:
      immutable:
        - {path: addressType}

  - type: ec2.services.k8s.aws/v1alpha1/VPCEndpoint
    attributes:
      resource-name:
        - {path: spec.routeTableRefs.*.from.name, target: ec2.services.k8s.aws/v1alpha1/RouteTable}
        - {path: spec.securityGroupRefs.*.from.name, target: ec2.services.k8s.aws/v1alpha1/SecurityGroup}
        - {path: spec.subnetRefs.*.from.name, target: ec2.services.k8s.aws/v1alpha1/Subnet}
        - {path: spec.vpcRef.from.name, target: ec2.services.k8s.aws/v1alpha1/VPC}
      immutable:
        - {path: spec.serviceNetworkARN}
        - {path: spec.serviceRegion}

  - type: eks.services.k8s.aws/v1alpha1/Capability
    attributes:
      immutable:
        - {path: spec.clusterName}
        - {path: spec.name}
        - {path: spec.type}

  - type: eks.services.k8s.aws/v1alpha1/Cluster
    attributes:
      resource-name:
        - {path: spec.resourcesVPCConfig.securityGroupRefs.*.from.name, target: ec2.services.k8s.aws/v1alpha1/SecurityGroup}
        - {path: spec.resourcesVPCConfig.subnetRefs.*.from.name, target: ec2.services.k8s.aws/v1alpha1/Subnet}
        - {path: spec.roleRef.from.name, target: iam.services.k8s.aws/v1alpha1/Role}
      immutable:
        - {path: spec.encryptionConfig}

  - type: eks.services.k8s.aws/v1alpha1/IdentityProviderConfig
    attributes:
      resource-name:
        - {path: spec.clusterRef.from.name, target: eks.services.k8s.aws/v1alpha1/Cluster}
      immutable:
        - {path: spec.clusterName}
        - {path: spec.oidc}
        - {path: spec.tags}

  - type: eks.services.k8s.aws/v1alpha1/Nodegroup
    attributes:
      resource-name:
        - {path: spec.clusterRef.from.name, target: eks.services.k8s.aws/v1alpha1/Cluster}
        - {path: spec.nodeRoleRef.from.name, target: iam.services.k8s.aws/v1alpha1/Role}
