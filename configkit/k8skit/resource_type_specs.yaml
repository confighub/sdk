        - {path: spec.includes.*.name, target: projectcontour.io/v1/HTTPProxy}
        - {path: spec.routes.*.services.*.name, target: v1/Service}
        - {path: spec.virtualhost.tls.secretName, target: v1/Secret}

  - type: projectcontour.io/v1/TLSCertificateDelegation
    attributes:
      resource-name:
        - {path: spec.delegations.*.secretName, target: v1/Secret}

  - type: rds.services.k8s.aws/v1alpha1/DBCluster
    attributes:
      resource-name:
        - {path: spec.dbClusterParameterGroupRef.from.name, target: rds.services.k8s.aws/v1alpha1/DBClusterParameterGroup}
        - {path: spec.dbSubnetGroupRef.from.name, target: rds.services.k8s.aws/v1alpha1/DBSubnetGroup}
        - {path: spec.vpcSecurityGroupRefs.*.from.name, target: ec2.services.k8s.aws/v1alpha1/SecurityGroup}

  - type: rds.services.k8s.aws/v1alpha1/DBClusterEndpoint
    attributes:
      resource-name:
        - {path: spec.dbClusterIdentifierRef.from.name, target: rds.services.k8s.aws/v1alpha1/DBCluster}

  - type: rds.services.k8s.aws/v1alpha1/DBClusterSnapshot
    attributes:
      resource-name:
        - {path: spec.dbClusterIdentifierRef.from.name, target: rds.services.k8s.aws/v1alpha1/DBCluster}

  - type: rds.services.k8s.aws/v1alpha1/DBSnapshot
    attributes:
      resource-name:
        - {path: spec.dbInstanceIdentifierRef.from.name, target: rds.services.k8s.aws/v1alpha1/DBInstance}

  - type: rds.services.k8s.aws/v1alpha1/DBSubnetGroup
    attributes:
      resource-name:
        - {path: spec.subnetRefs.*.from.name, target: ec2.services.k8s.aws/v1alpha1/Subnet}

  - type: source.toolkit.fluxcd.io/v1/GitRepository
    attributes:
      resource-name:
        - {path: spec.secretRef.name, target: v1/Secret}

  - type: source.toolkit.fluxcd.io/v1/HelmChart
    attributes:
      resource-name:
        - {path: spec.sourceRef.name, target: source.toolkit.fluxcd.io/v1/HelmRepository}
        - {path: spec.valuesFiles.*.name, target: v1/ConfigMap}

  - type: source.toolkit.fluxcd.io/v1/HelmRepository
    attributes:
      resource-name:
        - {path: spec.secretRef.name, target: v1/Secret}

  - type: source.toolkit.fluxcd.io/v1beta2/Bucket
    attributes:
      resource-name:
        - {path: spec.secretRef.name, target: v1/Secret}

  - type: source.toolkit.fluxcd.io/v1beta2/OCIRepository
    attributes:
      resource-name:
        - {path: spec.certSecretRef.name, target: v1/Secret}
        - {path: spec.secretRef.name, target: v1/Secret}
        - {path: spec.serviceAccountName, target: v1/ServiceAccount}

  - type: traefik.io/v1alpha1/IngressRoute
    attributes:
      resource-name:
        - {path: spec.routes.*.middlewares.*.name, target: traefik.io/v1alpha1/Middleware}
        - {path: spec.routes.*.services.*.name, target: v1/Service}
        - {path: spec.tls.secretName, target: v1/Secret}

  - type: traefik.io/v1alpha1/IngressRouteTCP
    attributes:
      resource-name:
        - {path: spec.routes.*.services.*.name, target: v1/Service}
        - {path: spec.tls.secretName, target: v1/Secret}

  - type: traefik.io/v1alpha1/IngressRouteUDP
    attributes:
      resource-name:
        - {path: spec.routes.*.services.*.name, target: v1/Service}
  - type: admissionregistration.k8s.io/v1/ValidatingAdmissionPolicyBinding
    attributes:
      resource-name:
        - {path: spec.policyName, target: admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy}

  - type: apiregistration.k8s.io/v1/APIService
    attributes:
      namespace-name-reference:
        - {path: "spec.service.|namespace", target: v1/Namespace}
      resource-name:
        - {path: "spec.service.|namespace", target: v1/Namespace}
        - {path: spec.service.name, target: v1/Service}

  - type: autoscaling/v2/HorizontalPodAutoscaler
    attributes:
      resource-name:
        - {path: spec.scaleTargetRef.name, target: apps/v1/Deployment}
        - {path: spec.scaleTargetRef.name, target: apps/v1/ReplicaSet}
        - {path: spec.scaleTargetRef.name, target: apps/v1/StatefulSet}
        - {path: spec.scaleTargetRef.name, target: v1/ReplicationController}

  - type: rbac.authorization.k8s.io/v1/ClusterRole
    attributes:
      resource-name:
        - {path: rules.*.resourceNames.*, target: v1/ConfigMap}
        - {path: rules.*.resourceNames.*, target: v1/PersistentVolume}
        - {path: rules.*.resourceNames.*, target: v1/Secret}

  - type: rbac.authorization.k8s.io/v1/Role
    attributes:
      resource-name:
        - {path: rules.*.resourceNames.*, target: v1/ConfigMap}
        - {path: rules.*.resourceNames.*, target: v1/Secret}

  # A Knative Service's spec.template is a RevisionTemplateSpec: pod metadata beside a
  # RevisionSpec, which embeds a PodSpec. So it carries a pod template like any workload,
  # and the upstream reference table listed exactly one of the pod spec's references for it.
  - type: serving.knative.dev/v1/Service
    embeds:
      - {shape: PodTemplate, path: spec.template}

  - type: v1/Node
    attributes:
      resource-name:
        - {path: spec.configSource.configMap.name, target: v1/ConfigMap}

  - type: v1/ConfigMap
    attributes:
      configmap-hash:
        - {path: metadata.annotations.confighub~1com/Hash, provided: true}

