apiVersion: apps/v1
kind: Deployment
metadata:
  name: lint-test
  namespace: example
  labels:
    app: lint-test
    app: duplicate-label
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lint-test
  template:
    metadata:
      labels:
        app: lint-test
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 8080
          env:
            - name: ENABLE_FEATURE
              value: yes
            - name: VERBOSE
              value: on
            - name: COUNTRY
              value: "no"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: Y
        - name: sidecar
          image: busybox:latest
          command: ["/bin/sh"]
          securityContext:
            fsGroup: 0755
      emptyField:
