apiVersion: v1
kind: Namespace
metadata:
  name: confighub
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: confighub-worker
  namespace: confighub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: confighub-confighub-worker-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: confighub-worker
  namespace: confighub
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: confighubplaceholder
  namespace: confighub
spec:
  replicas: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: confighubplaceholder
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: confighubplaceholder
    spec:
      serviceAccountName: confighub-worker
      terminationGracePeriodSeconds: 60
      containers:
      - name: worker
        image: ghcr.io/confighubai/confighub-worker:latest
        imagePullPolicy: Always
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        envFrom:
        - secretRef:
            name: confighub-worker-secret
