name: Build and Release CLI Binaries

# Every release publishes, next to the cub binaries:
#   THIRD_PARTY_LICENSES-cub.txt        notices and license texts for every
#                                       third-party module linked into cub
#                                       (MIT/BSD/Apache require them to
#                                       accompany binary distributions)
#   cub-<os>-<arch>.spdx.json           an SPDX SBOM generated from each binary
#   cub-<os>-<arch>.sigstore.json       a cosign keyless signature of each binary,
#                                       as a Sigstore bundle
#   cub-<os>-<arch>.sbom.sigstore.json  the SBOM as a signed attestation about
#                                       the binary, as a Sigstore bundle
# The signing identity of both is this workflow at the release tag. README.md
# has the verify commands.
# The notices job doubles as a license gate: a forbidden or restricted (copyleft)
# dependency fails it, and no binary is uploaded.
#
# cub-worker-run is not released. A worker process is built from this SDK by
# whoever needs one; `make build-worker` still builds the reference binary for
# development and the e2e suite.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # go-licenses needs a native GOROOT. Fail loudly if the installed Go is
      # older than the module's toolchain line instead of auto-downloading one.
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - name: Generate third-party notices (fails on disallowed licenses)
        run: |
          .github/scripts/gen-third-party-licenses.sh cub cmd/cub bin/THIRD_PARTY_LICENSES-cub.txt

      - name: Upload notices to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the release if it doesn't exist yet
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes 2>/dev/null || true
          gh release upload ${{ github.ref_name }} \
            ./bin/THIRD_PARTY_LICENSES-cub.txt \
            --clobber

  build-binaries:
    needs: notices
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # The OIDC token cosign exchanges for a short-lived signing certificate.
      id-token: write
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Prepare modules
        run: make all-prep

      - name: Build
        run: |
          echo "Building for ${{ matrix.goos }}/${{ matrix.goarch }} version ${{ github.ref_name }}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            VERSION=${{ github.ref_name }} RELEASE=1 make build-cli

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.2
        with:
          syft-version: v1.51.1

      - name: Generate SBOM from the built binary
        env:
          # The binary's embedded build info gives exact module versions; this
          # resolves each module's license from the Go module proxy as well.
          SYFT_GOLANG_SEARCH_REMOTE_LICENSES: "true"
        run: |
          f=./bin/cub-${{ matrix.goos }}-${{ matrix.goarch }}
          syft "file:${f}" \
            --source-name cub --source-version "${{ github.ref_name }}" \
            -o "spdx-json=${f}.spdx.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the binary and attest its SBOM
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          f=./bin/cub-${{ matrix.goos }}-${{ matrix.goarch }}
          cosign sign-blob --yes --bundle "${f}.sigstore.json" "${f}"
          cosign attest-blob --yes \
            --type spdxjson \
            --predicate "${f}.spdx.json" \
            --bundle "${f}.sbom.sigstore.json" \
            "${f}"
          # Verify as a user would, so a binary is never uploaded with a
          # signature or attestation that does not check out.
          cosign verify-blob \
            --bundle "${f}.sigstore.json" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${ISSUER}" \
            "${f}"
          cosign verify-blob-attestation \
            --type spdxjson \
            --bundle "${f}.sbom.sigstore.json" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${ISSUER}" \
            "${f}"

      - name: Upload binary, SBOM, signature and attestation to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            ./bin/cub-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./bin/cub-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json \
            ./bin/cub-${{ matrix.goos }}-${{ matrix.goarch }}.sigstore.json \
            ./bin/cub-${{ matrix.goos }}-${{ matrix.goarch }}.sbom.sigstore.json \
            --clobber
