name: Build and Release CLI Binaries

# Every release publishes, next to the binaries:
#   THIRD_PARTY_LICENSES-<binary>.txt   notices and license texts for every
#                                       third-party module linked into cub and
#                                       cub-worker-run (MIT/BSD/Apache require
#                                       them to accompany binary distributions)
#   <binary>-<os>-<arch>.spdx.json      an SPDX SBOM generated from each binary
# The notices job doubles as a license gate: a forbidden or restricted (copyleft)
# dependency fails it, and no binary is uploaded.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # go-licenses needs a native GOROOT. Fail loudly if the installed Go is
      # older than the module's toolchain line instead of auto-downloading one.
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - name: Generate third-party notices (fails on disallowed licenses)
        run: |
          .github/scripts/gen-third-party-licenses.sh cub cmd/cub bin/THIRD_PARTY_LICENSES-cub.txt
          .github/scripts/gen-third-party-licenses.sh cub-worker-run cmd/cub-worker bin/THIRD_PARTY_LICENSES-cub-worker-run.txt

      - name: Upload notices to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the release if it doesn't exist yet
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes 2>/dev/null || true
          gh release upload ${{ github.ref_name }} \
            ./bin/THIRD_PARTY_LICENSES-cub.txt \
            ./bin/THIRD_PARTY_LICENSES-cub-worker-run.txt \
            --clobber

  build-binaries:
    needs: notices
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Prepare modules
        run: make all-prep

      - name: Build
        run: |
          echo "Building for ${{ matrix.goos }}/${{ matrix.goarch }} version ${{ github.ref_name }}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            VERSION=${{ github.ref_name }} RELEASE=1 make build-cli
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            VERSION=${{ github.ref_name }} RELEASE=1 make build-worker

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.2
        with:
          syft-version: v1.51.1

      - name: Generate SBOMs from the built binaries
        env:
          # The binary's embedded build info gives exact module versions; this
          # resolves each module's license from the Go module proxy as well.
          SYFT_GOLANG_SEARCH_REMOTE_LICENSES: "true"
        run: |
          for bin in cub cub-worker-run; do
            f=./bin/${bin}-${{ matrix.goos }}-${{ matrix.goarch }}
            syft "file:${f}" \
              --source-name "${bin}" --source-version "${{ github.ref_name }}" \
              -o "spdx-json=${f}.spdx.json"
          done

      - name: Upload binaries and SBOMs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            ./bin/cub-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./bin/cub-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json \
            ./bin/cub-worker-run-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./bin/cub-worker-run-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json \
            --clobber
